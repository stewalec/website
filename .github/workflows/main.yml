name: Mirror to Codeberg

on:
  push:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Mirror code
        run: |
          git remote add codeberg https://stewalec:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/${{ github.repository }}.git
          echo "git push --mirror codeberg"
